; Pairs with a music server, follows a zone, prints the position as it is pushed.
; Two boards, the same ones the TFT Panel firmware supports:
;   waveshare-p4-7b   ESP32-P4 (Wi-Fi through the on-board ESP32-C6)
;   crowpanel7        ESP32-S3, 4 MB flash: the one whose flash budget is tight
;
; Wi-Fi: the example reads the credentials the TFT Panel firmware stored in NVS
; (namespace "tftpanel", keys "ssid" / "pass"), so nothing has to be typed or committed.
; On a fresh board, set them with -DWIFI_SSID=\"...\" -DWIFI_PASS=\"...\" locally.
;
; Flash cost of the library: build with and without -DNO_CLIENT and compare.
;   pio run -e crowpanel7 && pio run -e crowpanel7-baseline

[platformio]
default_envs = waveshare-p4-7b

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
lib_deps =
    bblanchon/ArduinoJson@7.4.2
    symlink://../..
build_flags = -I ../../ports/arduino -DCORE_DEBUG_LEVEL=2

[env:waveshare-p4-7b]
board = esp32-p4_r3
board_build.flash_mode = qio
upload_speed = 921600
build_flags = ${env.build_flags} -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1

[env:crowpanel7]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 4MB
upload_speed = 460800
build_flags = ${env.build_flags} -DBOARD_HAS_PSRAM -DARDUINO_USB_CDC_ON_BOOT=0

; The same image without the client: the difference is what the library costs in flash.
[env:crowpanel7-baseline]
extends = env:crowpanel7
build_flags = ${env:crowpanel7.build_flags} -DNO_CLIENT

[env:waveshare-p4-7b-baseline]
extends = env:waveshare-p4-7b
build_flags = ${env:waveshare-p4-7b.build_flags} -DNO_CLIENT
